{#include layout}{#content}<h1>Mantenimiento</h1><nav class="mb-3">{#for name in resources}<a class="btn btn-sm btn-outline-primary" href="/panel/gestion?resource={name}">{name}</a> {/for}</nav>
{#if message}<div class="alert alert-success">{message}</div>{/if}{#if error}<div class="alert alert-danger">{error}</div>{/if}
<h2 class="h4">{resource}</h2><form action="/panel/gestion" method="post" class="card card-body"><input type="hidden" name="resource" value="{resource}">{#if id}<input type="hidden" name="id" value="{id}">{/if}<label for="payload">Datos del registro (JSON)</label><textarea id="payload" class="form-control font-monospace" rows="6" name="payload">{input}</textarea><div class="mt-2"><button name="action" value="save" class="btn btn-primary">{#if id}Guardar cambios{#else}Crear registro{/if}</button> {#if id}<button name="action" value="delete" class="btn btn-outline-danger">Eliminar registro</button>{/if}</div></form>
<table class="table mt-3"><thead><tr><th>Registro</th><th>Acción</th></tr></thead><tbody>{#for row in rows}<tr><td class="text-break"><code>{row}</code></td><td><a href="/panel/gestion?resource={resource}&amp;id={row.get('id').asLong}">Editar</a></td></tr>{#else}<tr><td>Sin registros.</td></tr>{/for}</tbody></table>{/content}{/include}
